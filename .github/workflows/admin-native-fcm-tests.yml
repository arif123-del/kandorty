name: Native Android FCM server safety
on:
  push:
    branches: [fix/admin-fcm-test-endpoint-20261120, fix/native-fcm-admin-reader-503-20261120, fix/native-fcm-admin-email-auth-403-20261121, fix/native-fcm-email-case-20261121, fix/native-fcm-auth-reason-20261121, fix/native-fcm-google-keys-20261121, fix/cloudflare-native-fcm-redirect-20261121, fix/native-fcm-provider-errors-20261121, fix/per-color-server-stock-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check stripe-release/worker.mjs
          node --check stripe-release/native-push.mjs
          node --check stripe-release/admin-auth.mjs
          node --check stripe-live-candidate/cod.mjs
          node --check stripe-live-candidate/fulfillment.mjs
          node --check stripe-release/lifecycle.mjs
      - name: Verify native FCM guards without contacting production
        run: node --test stripe-release/native-push.test.mjs stripe-release/admin-auth.test.mjs stripe-release/order-push.test.mjs
      - name: Verify color-specific COD, Stripe, and cancellation stock
        run: node --test stripe-live-candidate/cod.test.mjs stripe-live-candidate/fulfillment.test.mjs stripe-release/release.test.mjs
      - name: Bundle color-safe Worker for review only
        run: npx --yes wrangler@4.153.0 deploy --dry-run --config stripe-release/wrangler.release.example.json --outdir /tmp/kandorty-color-safe-worker
      - uses: actions/upload-artifact@v4
        with:
          name: kandorty-variant-stock-worker-review
          path: /tmp/kandorty-color-safe-worker
          retention-days: 7
