name: Native Android FCM server safety
on:
  push:
    branches: [fix/admin-fcm-test-endpoint-20261120, fix/native-fcm-admin-reader-503-20261120, fix/native-fcm-admin-email-auth-403-20261121, fix/native-fcm-email-case-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check stripe-release/worker.mjs
          node --check stripe-release/native-push.mjs
          node --check stripe-release/admin-auth.mjs
      - name: Verify native FCM guards without contacting production
        run: node --test stripe-release/native-push.test.mjs stripe-release/admin-auth.test.mjs stripe-release/order-push.test.mjs
      - name: Verify existing Stripe + COD release behavior
        run: node --test stripe-release/release.test.mjs
