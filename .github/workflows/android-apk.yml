name: Kandorty Android APK
on:
  push:
    branches: [kandorty-android-2.3.10-apk, fix/android-logo-direct-home-20261123]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature and version
        run: |
          tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$tools_dir/apksigner" verify "$apk"
          "$tools_dir/aapt" dump badging "$apk" > "$RUNNER_TEMP/kandorty-badging"
          grep -F "package: name='online.kandorty.app.preview2310' versionCode='24' versionName='2.3.11'" "$RUNNER_TEMP/kandorty-badging"
      - uses: actions/upload-artifact@v4
        with:
          name: Kandorty-2.3.11-Direct-Home-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Test confirmation and Android Back using synthetic pages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: gradle --no-daemon :app:connectedDebugAndroidTest
