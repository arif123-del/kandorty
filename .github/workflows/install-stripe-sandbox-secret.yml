name: Install Stripe Sandbox key into isolated TEST Worker (one-off)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-stripe-sandbox-secret.yml

permissions:
  contents: read

jobs:
  install-test-only-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
    steps:
      - name: Fail closed on absent credentials and live Stripe keys
        shell: bash
        run: |
          python3 - <<'PY'
          import os,sys
          key=os.environ.get('STRIPE_SANDBOX_SECRET_KEY','')
          if not key.startswith('sk_test_') or len(key)<16:
              sys.exit('Rejected: Stripe Sandbox key not correctly configured (no secret values printed).')
          if not os.environ.get('CLOUDFLARE_API_TOKEN') or not os.environ.get('CLOUDFLARE_ACCOUNT_ID'):
              sys.exit('Cloudflare authorization missing.')
          print('Validated TEST-only inputs; no secret material printed.')
          PY
      - name: Set only STRIPE_SECRET_KEY on the named isolated TEST Worker
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import os,sys;sys.stdout.write(os.environ['STRIPE_SANDBOX_SECRET_KEY'])" |
            npx --yes wrangler@4 secret put STRIPE_SECRET_KEY --name kandorty-stripe-orders-test
          echo 'Stripe Sandbox key installed on isolated kandorty-stripe-orders-test Worker only.'
