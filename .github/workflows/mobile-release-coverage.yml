name: Current Firebase release coverage read only
on:
  push:
    branches: [sandbox-mobile-product-nov18]
    paths: [.github/workflows/mobile-release-coverage.yml]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts firebase-admin@13
      - name: Check Auth Storage and Rules coverage without writes
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node .github/scripts/stripe-stage4-nonfirestore-coverage-readonly.mjs
      - name: Identify recovery access using aggregate HTTP status only
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node --input-type=module <<'JS'
          import {cert} from 'firebase-admin/app';
          const c=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON),p='kandorty-9378a';
          if(c.project_id!==p) throw Error('unexpected project');
          const t=await cert(c).getAccessToken();
          for(const [name,url] of Object.entries({
            RULES:'https://firebaserules.googleapis.com/v1/projects/'+p+'/releases?pageSize=1&fields=releases(name)',
            MEDIA:'https://storage.googleapis.com/storage/v1/b/'+p+'.firebasestorage.app/o?maxResults=1&fields=items(generation)',
          })){
            const r=await fetch(url,{headers:{authorization:'Bearer '+t.access_token},redirect:'error'});
            let reason='';if(!r.ok){const j=await r.json();reason=j.error?.details?.find(x=>x.reason)?.reason??j.error?.errors?.[0]?.reason??'';}
            console.log('COVERAGE_'+name+' '+r.status+' '+(/^[a-zA-Z_]{1,60}$/.test(reason)?reason:''));
          }
          JS
