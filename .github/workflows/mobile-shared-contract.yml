name: Kandorty mobile shared storefront contract
on:
  pull_request:
    paths:
      - 'shared/mobile-app-contract.json'
      - 'ios/KandortyIOS/**'
      - 'android/CustomerApp/**'
      - 'tests/cross-platform-storefront.cjs'
      - '.github/workflows/mobile-shared-contract.yml'
  push:
    paths:
      - 'shared/mobile-app-contract.json'
      - 'ios/KandortyIOS/**'
      - 'android/CustomerApp/**'
      - 'tests/cross-platform-storefront.cjs'
      - '.github/workflows/mobile-shared-contract.yml'
  workflow_dispatch:
jobs:
  shared-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Android and iOS target the same production site
        run: node --test tests/cross-platform-storefront.cjs
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile customer debug app (unsigned)
        working-directory: android/CustomerApp
        run: gradle --no-daemon :app:assembleDebug
