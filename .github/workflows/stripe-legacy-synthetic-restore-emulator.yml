name: Kandorty Stage 4 synthetic Firestore emulator recovery rehearsal (NO LIVE)
on:
  push:
    branches: [stripe-live-fulfillment-hardening]
    paths:
      - 'stripe-release/legacy-synthetic-restore-emulator.test.mjs'
      - '.github/workflows/stripe-legacy-synthetic-restore-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-recovery-emulator:
    if: github.ref == 'refs/heads/stripe-live-fulfillment-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator and Firestore SDK
        working-directory: stripe-live-candidate
        run: npm install --no-save --no-package-lock --ignore-scripts firebase-tools@14 firebase-admin@13
      - name: Validate fake-project-only preconditions
        run: |
          node --check stripe-release/legacy-synthetic-restore-emulator.test.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const src=fs.readFileSync('stripe-release/legacy-synthetic-restore-emulator.test.mjs','utf8');
          assert.ok(src.includes("demo-kandorty-legacy-rehearsal"));
          assert.ok(src.includes("FIRESTORE_EMULATOR_HOST"));
          assert.ok(src.includes("no_credentials_allowed_"));
          assert.ok(!src.includes("kandorty-9378a"));
          assert.ok(!src.includes("https://firestore.googleapis.com"));
          console.log("ISOLATED_EMULATOR_GUARD: PASS");
          JS
      - name: Test synthetic 99-order 254-document reconstruction in local Firestore emulator
        working-directory: stripe-live-candidate
        env:
          GCLOUD_PROJECT: demo-kandorty-legacy-rehearsal
          GOOGLE_CLOUD_PROJECT: demo-kandorty-legacy-rehearsal
          GOOGLE_APPLICATION_CREDENTIALS: ''
          FIREBASE_SERVICE_ACCOUNT_JSON: ''
          STRIPE_TEST_SERVICE_ACCOUNT_JSON: ''
          STRIPE_SECRET_KEY: ''
          FIREBASE_TOKEN: ''
          CI: 'true'
        run: |
          ln -s ../stripe-live-candidate/node_modules ../stripe-release/node_modules
          ./node_modules/.bin/firebase emulators:exec --project demo-kandorty-legacy-rehearsal --only firestore 'node --test ../stripe-release/legacy-synthetic-restore-emulator.test.mjs'
      - name: Safety reminder
        if: always()
        run: echo "SYNTHETIC ONLY. No production Firebase, orders, customer data, payment, inventory, webhook, Rules, Ziina or site deployment."
