name: Kandorty LIVE fulfillment candidate tests (NO DEPLOY)
on:
  push:
    branches: [stripe-live-fulfillment-hardening]
    paths:
      - stripe-live-candidate/**
      - .github/workflows/stripe-live-candidate-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify no staging or LIVE deploy exists in candidate
        run: |
          test ! -e stripe-live-candidate/wrangler.jsonc
          test ! -e stripe-live-candidate/wrangler.toml
          echo "Safety: no Cloudflare deployment, no live keys, no production database reads/writes."
      - name: Atomic order, stock and idempotency unit tests
        run: node --test stripe-live-candidate/fulfillment.test.mjs stripe-live-candidate/cancellation.test.mjs stripe-live-candidate/atomic-commit.test.mjs
