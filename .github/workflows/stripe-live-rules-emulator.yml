name: Firestore future rules emulator tests (NO DEPLOY)

on:
  push:
    branches: [stripe-live-fulfillment-hardening]
    paths:
      - 'stripe-live-candidate/firestore.rules'
      - 'stripe-live-candidate/firestore.rules.test.mjs'
      - 'stripe-live-candidate/firebase.json'
      - '.github/workflows/stripe-live-rules-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stripe-live-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator and isolated rules testing libraries
        run: npm install --no-save firebase@12 @firebase/rules-unit-testing@6 firebase-tools@14
      - name: Run actual Firebase Rules emulator with fake project
        env:
          CI: 'true'
          FIREBASE_TOKEN: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          ./node_modules/.bin/firebase emulators:exec --project demo-kandorty-stripe-rules-only --only firestore 'node --test firestore.rules.test.mjs'
      - name: Confirm NO production deploy commands are in this workflow
        run: |
          echo "No Firestore rules publish; no Kandorty production access; local mock data only."
