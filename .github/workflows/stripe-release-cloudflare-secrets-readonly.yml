name: Kandorty Cloudflare production secret NAMES READ ONLY (NO DEPLOY)
on:
  push:
    branches: [stripe-live-fulfillment-hardening]
    paths:
      - '.github/workflows/stripe-release-cloudflare-secrets-readonly.yml'
      - 'stripe-release/verify-cloudflare-secret-bindings.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare-secret-names-only:
    if: github.ref == 'refs/heads/stripe-live-fulfillment-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required Cloudflare Worker secret names without fetching values or deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node stripe-release/verify-cloudflare-secret-bindings.mjs
      - name: Clarify limits of secret-name audit
        if: always()
        run: echo 'Read-only metadata check. Does NOT verify secret values, Stripe webhook delivery, Worker release mode, storefront routing, Firebase Rules, Android compatibility or Live readiness.'
