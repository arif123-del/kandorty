name: Stripe disabled Worker public URL setup (NO LIVE, NO CUSTOM ROUTES)
on:
  push:
    branches: [stripe-live-fulfillment-hardening]
    paths:
      - '.github/workflows/stripe-release-disabled-cloudflare.yml'
      - 'stripe-release/wrangler.release.example.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kandorty-stripe-disabled-shell
  cancel-in-progress: false
jobs:
  deploy-disabled-shell-only:
    if: github.ref == 'refs/heads/stripe-live-fulfillment-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert zero exposure, zero secret use, and Live disabled
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const cfg=JSON.parse(fs.readFileSync('stripe-release/wrangler.release.example.json','utf8'));
          assert.equal(cfg.name,'kandorty-stripe-release');
          assert.equal(cfg.vars.STRIPE_MODE,'disabled');
          assert.equal(cfg.vars.LIVE_RELEASE_APPROVAL,'NOT_APPROVED');
          assert.equal(cfg.vars.CHECKOUT_DISABLED,'true');
          assert.equal(cfg.vars.FIREBASE_PROJECT_ID,'kandorty-9378a');
          assert.equal(cfg.workers_dev,true);
          assert.equal(cfg.preview_urls,false);
          assert.deepEqual(cfg.routes,[]);
          assert.ok(!cfg.triggers && !cfg.crons);
          console.log('PASS: release worker disabled, single public workers.dev URL, no custom routes, no cron, no Live payment access');
          JS
      - name: Deploy ONLY separate INERT Cloudflare Worker shell
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.153.0
          workingDirectory: stripe-release
          command: deploy --config wrangler.release.example.json
      - name: Probe public endpoint and confirm ALL requests fail closed
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://kandorty-stripe-release.aliyajan200011.workers.dev';
          const probes=[
            ['GET','/'],
            ['POST','/webhook'],
            ['POST','/create-checkout-session'],
            ['POST','/cod/orders']
          ];
          for(const [method,path] of probes){
            let ok=false;
            for(let i=0;i<8&&!ok;i++){
              try{
                const res=await fetch(base+path,{method,redirect:'error',signal:AbortSignal.timeout(13000),...(method==='POST'?{headers:{'Content-Type':'application/json'},body:'{}'}:{})});
                const body=await res.json();
                assert.equal(res.status,503,method+' '+path+' status');
                assert.equal(body.error,'release_disabled',method+' '+path+' response');
                assert.equal(res.headers.get('cache-control'),'no-store');
                ok=true;
              }catch(e){
                if(i===7)throw new Error('Public disabled endpoint did not pass strict 503 check: '+method+' '+path);
                await new Promise(r=>setTimeout(r,2000));
              }
            }
            console.log('PASS: '+method+' '+path+' => 503 release_disabled');
          }
          console.log('PASS: public URL exists; checkout/card/COD/webhook remain disabled. No Live API activity.');
          JS
      - name: Confirm limited scope
        run: echo 'Only isolated disabled workers.dev endpoint; no custom domains, no routes, no production site changes, no Firebase Rules, no Ziina, no Stripe Live activation.'

