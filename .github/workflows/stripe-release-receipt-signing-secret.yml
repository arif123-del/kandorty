name: Stripe disabled release - install fresh guest receipt key (NO LIVE)
on:
  push:
    branches: [stripe-live-fulfillment-hardening]
    paths:
      - '.github/workflows/stripe-release-receipt-signing-secret.yml'
permissions:
  contents: read
concurrency:
  group: kandorty-stripe-disabled-shell
  cancel-in-progress: false
jobs:
  receipt-key-disabled-only:
    if: github.ref == 'refs/heads/stripe-live-fulfillment-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert dedicated worker has no public routes and cannot accept checkout
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const cfg=JSON.parse(readFileSync('stripe-release/wrangler.release.example.json','utf8'));
          assert.equal(cfg.name,'kandorty-stripe-release');
          assert.equal(cfg.vars.STRIPE_MODE,'disabled');
          assert.equal(cfg.vars.LIVE_RELEASE_APPROVAL,'NOT_APPROVED');
          assert.equal(cfg.vars.CHECKOUT_DISABLED,'true');
          assert.equal(cfg.vars.FIREBASE_PROJECT_ID,'kandorty-9378a');
          assert.equal(cfg.workers_dev,false);
          assert.equal(cfg.preview_urls,false);
          assert.deepEqual(cfg.routes,[]);
          assert.ok(!cfg.triggers&&!cfg.crons);
          console.log('PASS: explicitly disabled separate release worker, no public routes or payments');
          JS
      - name: Install fresh 256-bit HMAC receipt secret directly into Cloudflare encrypted storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          # Secret passes directly through anonymous pipe: never echo it into a log, file, or artifact.
          node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))" |
            npx --yes wrangler@4.153.0 secret put STRIPE_RECEIPT_SECRET --config stripe-release/wrangler.release.example.json
          echo 'PASS: guest-receipt secret installed on detached disabled worker; no public routes'
