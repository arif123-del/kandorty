name: Kandorty isolated TEST cron and Resend binding audit READ ONLY
on:
  push:
    branches: [stripe-live-fulfillment-hardening]
    paths:
      - 'stripe-release/test-cron-readonly.mjs'
      - '.github/workflows/stripe-release-test-cron-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-test-audit:
    if: github.ref == 'refs/heads/stripe-live-fulfillment-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query TEST Worker schedules and binding types without printing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node stripe-release/test-cron-readonly.mjs
      - name: State security boundary
        if: always()
        run: echo 'Audit read-only only; no deployment, webhook mutation, DNS, Stripe Live, Firestore write, order modification, or Resend email test was performed.'
