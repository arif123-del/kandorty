name: Stripe isolated staging tests
on:
  push:
    branches: [stripe-security-audit]
    paths: ['stripe-staging/**', '.github/workflows/stripe-staging-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Payment, webhook and atomic persistence tests (mock services)
        run: node --test stripe-staging/*.test.mjs
      - name: Report integration configuration presence only
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
          STRIPE_TEST_SERVICE_ACCOUNT_JSON: ${{ secrets.STRIPE_TEST_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import os
          for name in ('STRIPE_SANDBOX_SECRET_KEY', 'STRIPE_SANDBOX_WEBHOOK_SECRET', 'STRIPE_TEST_SERVICE_ACCOUNT_JSON'):
              print(name + ': ' + ('present (not validated)' if os.environ.get(name) else 'missing'))
          print('No deployment performed. Live remains blocked until real Sandbox integration tests pass.')
          PY
