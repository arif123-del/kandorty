name: Stripe TEST browser end-to-end payment (Sandbox only)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/stripe-test-browser-e2e.yml']

permissions:
  contents: read

jobs:
  sandbox-test-card:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stripe-security-audit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation for a TEST card only
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Complete Sandbox checkout without live charges
        run: node stripe-staging/browser-e2e.mjs
