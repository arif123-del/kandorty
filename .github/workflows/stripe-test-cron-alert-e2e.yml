name: Kandorty isolated synthetic Cron Resend end-to-end TEST ONLY
on:
  push:
    branches: [stripe-live-fulfillment-hardening]
    paths:
      - '.github/scripts/synthetic-test-cron-alert-e2e.mjs'
      - '.github/workflows/stripe-test-cron-alert-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kandorty-synthetic-operator-alert-test
  cancel-in-progress: false
jobs:
  temporary-synthetic-review:
    if: github.ref == 'refs/heads/stripe-live-fulfillment-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check smoke test syntax with no credentials
        run: node --check .github/scripts/synthetic-test-cron-alert-e2e.mjs
      - name: Write and close one synthetic review in TEST Firebase only
        env:
          STRIPE_TEST_SERVICE_ACCOUNT_JSON: ${{ secrets.STRIPE_TEST_SERVICE_ACCOUNT_JSON }}
        run: node .github/scripts/synthetic-test-cron-alert-e2e.mjs
      - name: Explain result and safety limits
        if: always()
        run: echo 'Provider acceptance via isolated TEST Cron is not inbox delivery. No production Firebase writes, Live Stripe, real orders, public site or Ziina change.'
