name: Kandorty prior TEST alert settings metadata READ ONLY
on:
  push:
    branches: [stripe-live-fulfillment-hardening]
    paths:
      - '.github/scripts/test-alert-config-version-readonly.mjs'
      - '.github/workflows/stripe-test-prior-alert-config-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prior-test-version-check:
    if: github.ref == 'refs/heads/stripe-live-fulfillment-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check historical test Worker settings without logging any values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/test-alert-config-version-readonly.mjs
      - name: State safety boundary
        if: always()
        run: echo 'Only historical TEST Worker metadata checked. No active bindings, DNS, live services, Firebase, secrets or customer data modified.'
