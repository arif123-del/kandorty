name: Stripe TEST secret readiness (read only)

on:
  push:
    branches: [main]
    paths: [.github/workflows/stripe-test-secret-readiness.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check only statuses; do not disclose key data or deploy
        env:
          CLOUD_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUD_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_TEST_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          STRIPE_WEBHOOK: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
          FIREBASE_CREDENTIAL: ${{ secrets.STRIPE_TEST_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import os,json
          def yes(name,b): print(name+': '+('ready' if b else 'missing or incompatible'))
          cred=os.environ.get('FIREBASE_CREDENTIAL','')
          project=False
          try:
              d=json.loads(cred)
              project = (d.get('project_id')=='kandorty-stripe-test-5f8af'
                  and d.get('type')=='service_account' and bool(d.get('private_key'))
                  and d.get('client_email','').endswith('@kandorty-stripe-test-5f8af.iam.gserviceaccount.com'))
          except (ValueError,TypeError): pass
          yes('Cloudflare repository token', bool(os.environ.get('CLOUD_TOKEN')) and bool(os.environ.get('CLOUD_ACCOUNT')))
          yes('Stripe TEST key',os.environ.get('STRIPE_TEST_KEY','').startswith('sk_test_'))
          yes('Isolated Firebase test credential project',project)
          yes('Dedicated staging service-account identity',project and d.get('client_email','')=='kandorty-stripe-staging@kandorty-stripe-test-5f8af.iam.gserviceaccount.com')
          yes('Stripe webhook signing secret',os.environ.get('STRIPE_WEBHOOK','').startswith('whsec_'))
          print('Read-only check complete; no secrets shown or sent, no deployment.')
          PY
